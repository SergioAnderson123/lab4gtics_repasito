<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <title>Lista de Doctores</title>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main>
    <div class="container px-4 py-5">
        <h1 class="pb-2 border-bottom">Lista de Doctores</h1>

        <div th:if="${mensaje}" class="alert alert-success mt-3">
            <span th:text="${mensaje}"></span>
        </div>

        <div class="d-flex mt-3 mb-4">
            <a class="btn btn-primary" th:href="@{/doctor/new}">Nuevo Doctor</a>
        </div>

        <table class="table table-striped mt-4">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre Completo</th>
                <th>DNI</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Fecha Incorporación</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor, info : ${listaDoctores}">
                <td th:text="${info.index + 1}"></td>
                <td th:text="${doctor.fullName}"></td>
                <td th:text="${doctor.dni}"></td>
                <td th:text="${doctor.email}"></td>
                <td th:text="${doctor.phoneNumber}"></td>
                <td th:text="${doctor.state.name}"></td>
                <td th:text="${#temporals.format(doctor.incorporationDate, 'dd/MM/yyyy')}"></td>
                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{'/doctor/edit?id=' + ${doctor.id}}">Editar</a>
                    <a class="btn btn-danger btn-sm"
                       th:href="@{'/doctor/delete?id=' + ${doctor.id}}">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
